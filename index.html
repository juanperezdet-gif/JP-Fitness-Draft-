<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JP FITNESS PRO — Limited User Validation</title>
<style>
:root{--bg:#eef3f6;--ink:#101318;--muted:#687782;--line:#d8e2e8;--blue:#64b8ef;--deep:#123b66}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}.stage{min-height:100vh;display:flex;justify-content:center;padding:12px}.phone{width:390px;height:844px;max-width:100%;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 20px 70px #10243826;border:1px solid #d6dfe5;position:relative;display:flex;flex-direction:column}.top{height:70px;padding:10px 14px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--deep)}.muted{font-size:10px;color:var(--muted);line-height:1.4}.track{height:5px;background:#d6e2e9;border-radius:99px;margin-top:8px;overflow:hidden}.track i{height:100%;display:block;background:var(--deep)}.main{flex:1;min-height:0;padding:11px 13px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.ey{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1,h2,p{margin:0}h1{font-size:22px;line-height:1.08}.hero,.summary{margin:auto 0;padding:22px 18px;border:1px solid #d8e8f2;border-radius:24px;background:linear-gradient(180deg,#fff,#f4fbff);text-align:center}.logo,.check{width:58px;height:58px;border-radius:18px;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;margin:0 auto 16px}.check{border-radius:50%;background:#e9f5fd;color:var(--deep)}.hero h1{font-size:27px}.hero p,.summary p{font-size:11px;color:var(--muted);margin:9px 0 16px;line-height:1.45}.btn{height:50px;border:0;border-radius:15px;background:var(--deep);color:#fff;font-size:12px;font-weight:900}.sec{border:1px solid #cfdbe2;background:#fff;border-radius:12px;padding:10px;font-size:9px;font-weight:900;color:#273743}.routine{display:flex;flex-direction:column;gap:7px}.ri{border:1px solid var(--line);border-radius:15px;padding:11px;display:flex;justify-content:space-between;align-items:center}.ri b{font-size:12px}.ri span{font-size:9px;color:var(--muted)}.mode{display:flex;gap:5px;background:#eef6fb;border:1px solid #d7e9f5;padding:4px;border-radius:13px}.mode button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-size:9px;font-weight:900;color:#596a75}.mode .on{background:#fff;color:var(--deep);box-shadow:0 2px 6px #123b6614}.series{font-size:18px;font-weight:900}.dots{display:flex;gap:6px}.dot{width:10px;height:10px;border-radius:50%;background:#d7dce0}.dot.done,.dot.current{background:var(--deep)}.dot.current{outline:3px solid #dcecf8}.visual{flex:1;min-height:330px;border:1px solid #d1e0e9;border-radius:19px;background:#f8fbfd;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}.visual img{width:100%;height:100%;object-fit:contain;display:block}.phase{position:absolute;left:10px;top:10px;background:#ffffffeb;border:1px solid #d4e0e7;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900;color:var(--deep)}.objective{border:1px solid var(--line);border-radius:15px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center}.objective strong{font-size:21px}.adjust{border:1px solid #d7e3eb;background:#f8fbfd;border-radius:15px;padding:9px}.ag{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ab{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}.step{display:flex;align-items:center;justify-content:space-between;margin-top:5px}.step button{width:31px;height:31px;border:0;border-radius:9px;background:#eaf3f9;color:var(--deep);font-size:17px;font-weight:900}.quick{border:1px solid var(--line);border-radius:17px;padding:12px}.quick strong{font-size:25px;display:block;margin:4px 0}.notice{border-radius:13px;padding:9px;background:#f2f7fa;font-size:9px;line-height:1.4;color:#4c5f6d}.diff{border:1px solid #e3d2a5;background:#fff9e9;border-radius:15px;padding:10px}.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.dg button{border:1px solid #decf9f;background:#fff;border-radius:10px;padding:8px 4px;font-size:8px;font-weight:900}.dg .on{background:var(--deep);color:#fff}.overlay{position:absolute;inset:0;background:#07111a80;z-index:20;display:flex;align-items:flex-end}.sheet{width:100%;background:#fff;border-radius:27px 27px 0 0;padding:18px}.restType{text-align:center;font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.1em}.clock{font-size:58px;font-weight:900;color:var(--deep);text-align:center;margin:8px 0}.restState{font-size:15px;font-weight:900;text-align:center;margin-bottom:10px}.nextCard{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fafcfd}.ra{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.ra button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 4px;font-size:8px;font-weight:900}.transition{align-self:center;margin:20px;background:#fff;border-radius:24px;padding:22px;width:calc(100% - 40px);text-align:center}.nextName{font-size:16px;font-weight:900;color:var(--deep);margin:7px 0}.stat{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:10px}@media(max-width:420px){.stage{padding:0}.phone{border-radius:0;border-left:0;border-right:0}}
</style></head><body><div class="stage"><div id="app" class="phone"></div></div>
<script>
(function(){'use strict';
var EX=[
 {key:'rdl',name:'Peso Muerto Rumano con Mancuernas',sets:3,reps:8,load:50,step:5,between:{type:'timed',seconds:8},after:{type:'timed',seconds:7}},
 {key:'press',name:'Press Inclinado con Mancuernas',sets:4,reps:10,load:22,step:2,between:{type:'none'},after:{type:'manual'}},
 {key:'curl',name:'Curl de Bíceps de Pie con Mancuernas',sets:3,reps:12,load:10,step:2,between:{type:'none'},after:{type:'none'}}
];
var IMG={
 rdl:['assets/rdl_inicio.png','assets/rdl_medio.png','assets/rdl_final.png'],
 press:['assets/press_inicio.png','assets/press_medio.png','assets/press_final.png'],
 curl:['assets/curl_inicio.png','assets/curl_medio.png','assets/curl_final.png']
};
var S={screen:'welcome',ex:0,phase:0,records:[{mode:'guided',sets:[],agg:false,d:null},{mode:'quick',sets:[],agg:false,d:null},{mode:'quick',sets:[],agg:false,d:null}],adjust:false,al:50,ar:8,diff:false,dt:'reps',dv:8,rest:null,rt:null};
function A(){return document.getElementById('app')}function done(i){var r=S.records[i],e=EX[i];return r.agg||r.d||r.sets.length>=e.sets}function prog(){var d=0;for(var i=0;i<3;i++)if(done(i))d++;return 6+d*31}function head(label){return "<div class='top'><div class='row'><div><div class='brand'>JP FITNESS PRO</div><div class='muted'>"+label+"</div></div><div class='muted'>"+(S.screen==='workout'?(S.ex+1)+' de 3':'')+"</div></div><div class='track'><i style='width:"+prog()+"%'></i></div></div>"}function dots(c,n){var h="<div class='dots'>";for(var i=1;i<=n;i++)h+="<i class='dot "+(i<c?'done':i===c?'current':'')+"'></i>";return h+"</div>"}function visual(e){return "<div class='visual'><img src='"+IMG[e.key][S.phase]+"' alt='"+e.name+"'><div class='phase'>"+['INICIO','MEDIO','FINAL'][S.phase]+"</div></div>"}function reset(){var e=EX[S.ex],r=S.records[S.ex],l=r.sets.length?r.sets[r.sets.length-1]:null;S.al=l?l.load:e.load;S.ar=l?l.reps:e.reps}function render(){if(S.screen==='welcome')return welcome();if(S.screen==='routine')return routine();if(S.screen==='summary')return summary();workout()}function welcome(){A().innerHTML=head('Bienvenido')+"<div class='main'><div class='hero'><div class='logo'>JP</div><h1>Tu entrenamiento está listo</h1><p>Una sesión corta para entrenar y registrar tu desempeño sin distraerte.</p><button class='btn' style='width:100%' data-a='routine'>VER ENTRENAMIENTO</button></div></div>"}function routine(){var h=head('Entrenamiento de hoy')+"<div class='main'><div><div class='ey'>Rutina</div><h1>Fuerza · 3 ejercicios</h1><div class='muted'>Completa la sesión a tu ritmo.</div></div><div class='routine'>";for(var i=0;i<3;i++)h+="<div class='ri'><div><b>"+EX[i].name+"</b><br><span>"+EX[i].sets+" series · "+EX[i].reps+" reps</span></div></div>";h+="</div><button class='btn' data-a='start'>INICIAR ENTRENAMIENTO</button></div>";A().innerHTML=h}function mode(r){return "<div class='mode'><button class='"+(r.mode==='guided'?'on':'')+"' data-a='mode' data-m='guided'>SERIE POR SERIE</button><button class='"+(r.mode==='quick'?'on':'')+"' data-a='mode' data-m='quick'>REGISTRO RÁPIDO</button></div>"}function workout(){var e=EX[S.ex],r=S.records[S.ex];A().innerHTML=head('Entrenamiento en curso')+"<div class='main'>"+mode(r)+"<div><div class='ey'>Ejercicio actual</div><h1>"+e.name+"</h1></div>"+(r.mode==='guided'?guided(e,r):quick(e,r))+"</div>";if(S.rest)restOverlay()}function guided(e,r){var c=Math.min(r.sets.length+1,e.sets),last=r.sets.length?r.sets[r.sets.length-1]:null,l=S.adjust?S.al:(last?last.load:e.load),rp=S.adjust?S.ar:(last?last.reps:e.reps);return "<div class='row'><div class='series'>SERIE "+c+" / "+e.sets+"</div>"+dots(c,e.sets)+"</div>"+visual(e)+"<div class='objective'><div><div class='ey'>Objetivo preparado</div><strong>"+l+" kg · "+rp+" reps</strong></div><button class='sec' data-a='"+(S.adjust?'close':'open')+"'>"+(S.adjust?'✓ LISTO':'AJUSTAR')+"</button></div>"+(S.adjust?adjust(e):"")+(r.sets.length?"<div class='notice'>"+r.sets.length+" serie(s) registradas.</div>":"")+"<button class='btn' data-a='set'>CONFIRMAR SERIE</button><button class='sec' data-a='rest-prescribed'>COMPLETAR EL RESTO COMO ESTABA INDICADO</button>"}function adjust(e){return "<div class='adjust'><div class='ag'><div class='ab'><div class='ey'>Carga real</div><div class='step'><button data-a='al' data-d='-1'>−</button><b>"+S.al+" kg</b><button data-a='al' data-d='1'>+</button></div></div><div class='ab'><div class='ey'>Reps realizadas</div><div class='step'><button data-a='ar' data-d='-1'>−</button><b>"+S.ar+"</b><button data-a='ar' data-d='1'>+</button></div></div></div></div>"}function quick(e,r){var keep=r.sets.length?"<div class='notice'>Se conservarán las "+r.sets.length+" serie(s) ya registradas.</div>":"";return "<div class='quick'><div class='ey'>Objetivo</div><strong>"+e.sets+" × "+e.reps+" · "+e.load+" kg</strong><div class='muted'>Si lo hiciste así, confirma el ejercicio completo.</div></div>"+visual(e)+keep+"<button class='btn' data-a='quick'>LO HICE COMO ESTABA INDICADO</button><button class='sec' data-a='diff'>ALGO FUE DIFERENTE</button>"+(S.diff?diffBox(e):"")}function diffBox(e){return "<div class='diff'><div class='ey'>¿Qué fue diferente?</div><div class='dg'><button class='"+(S.dt==='sets'?'on':'')+"' data-a='pick' data-t='sets'>MENOS SERIES</button><button class='"+(S.dt==='reps'?'on':'')+"' data-a='pick' data-t='reps'>REPS</button><button class='"+(S.dt==='load'?'on':'')+"' data-a='pick' data-t='load'>CARGA</button></div><div class='step'><button data-a='dv' data-d='-1'>−</button><b>"+S.dv+(S.dt==='load'?' kg':'')+"</b><button data-a='dv' data-d='1'>+</button></div><button class='btn' style='width:100%;margin-top:8px' data-a='save'>GUARDAR CAMBIO</button></div>"}function startRest(cfg,kind,next){if(!cfg||cfg.type==='none')return transition(next);S.rest={type:cfg.type,seconds:cfg.seconds||0,state:'ACTIVE',kind:kind,next:next};workout();if(cfg.type==='timed'){clearInterval(S.rt);S.rt=setInterval(function(){if(!S.rest)return clearInterval(S.rt);S.rest.seconds--;if(S.rest.seconds<=5&&S.rest.seconds>0)S.rest.state='ENDING';if(S.rest.seconds<=0){S.rest.seconds=0;S.rest.state='COMPLETE';clearInterval(S.rt)}workout()},1000)}}function restOverlay(){var r=S.rest,next=r.kind==='series'?'SERIE '+(S.records[S.ex].sets.length+1)+' / '+EX[S.ex].sets:(r.next<3?EX[r.next].name:'Finalizar entrenamiento');if(r.type==='manual'){A().insertAdjacentHTML('beforeend',"<div class='overlay'><div class='sheet'><div class='restType'>DESCANSO / TRANSICIÓN ENTRE EJERCICIOS</div><div class='restState'>Cuando estés listo</div><div class='nextCard'><div class='ey'>Siguiente</div><b>"+next+"</b></div><button class='btn' style='width:100%;margin-top:12px' data-a='manual'>CONTINUAR</button></div></div>");return}var state=r.state==='ACTIVE'?'DESCANSO':r.state==='ENDING'?'CASI LISTO':'LISTO';A().insertAdjacentHTML('beforeend',"<div class='overlay'><div class='sheet'><div class='restType'>"+(r.kind==='series'?'DESCANSO ENTRE SERIES':'DESCANSO / TRANSICIÓN ENTRE EJERCICIOS')+" · VALIDACIÓN</div><div class='clock'>00:"+String(r.seconds).padStart(2,'0')+"</div><div class='restState'>"+state+"</div><div class='nextCard'><div class='ey'>Siguiente</div><b>"+next+"</b></div><div class='ra'><button data-a='rt' data-d='-2'>− tiempo</button><button data-a='rt' data-d='2'>+ tiempo</button><button data-a='early'>CONTINUAR AHORA</button></div>"+(r.state==='COMPLETE'?"<button class='btn' style='width:100%;margin-top:10px' data-a='done'>CONTINUAR</button>":"")+"</div></div>")}function finish(){startRest(EX[S.ex].after,'exercise',S.ex+1)}function transition(next){clearInterval(S.rt);S.rest=null;var nx=next<3?EX[next]:null;A().insertAdjacentHTML('beforeend',"<div class='overlay' style='align-items:center'><div class='transition'><div class='check'>✓</div><h2>Ejercicio completado</h2>"+(nx?"<div class='muted'>SIGUIENTE:</div><div class='nextName'>"+nx.name+"</div><div class='muted'>Preparando ejercicio…</div>":"<div class='muted'>Entrenamiento completado.</div>")+"</div></div>");setTimeout(function(){if(nx){var prev=S.records[S.ex].mode;S.ex=next;S.records[S.ex].mode=prev;S.adjust=false;S.diff=false;reset();workout()}else{S.screen='summary';render()}},900)}function summary(){A().innerHTML=head('Sesión finalizada')+"<div class='main'><div class='summary'><div class='check'>✓</div><h1>Entrenamiento completado</h1><p>Esto fue lo que completaste hoy.</p><div class='stat'><span>Ejercicios</span><b>3 / 3</b></div><div class='stat'><span>Sesión</span><b>Completada</b></div></div></div>"}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,e=EX[S.ex],r=S.records[S.ex];if(a==='routine'){S.screen='routine';render()}else if(a==='start'){S.screen='workout';reset();render()}else if(a==='mode'){r.mode=b.dataset.m;S.adjust=false;S.diff=false;reset();workout()}else if(a==='open'){S.adjust=true;reset();workout()}else if(a==='close'){S.adjust=false;workout()}else if(a==='al'){S.al=Math.max(0,S.al+(+b.dataset.d)*e.step);workout()}else if(a==='ar'){S.ar=Math.max(0,S.ar+(+b.dataset.d));workout()}else if(a==='set'){var last=r.sets.length?r.sets[r.sets.length-1]:null;r.sets.push({load:S.adjust?S.al:(last?last.load:e.load),reps:S.adjust?S.ar:(last?last.reps:e.reps)});S.adjust=false;reset();if(r.sets.length>=e.sets)finish();else startRest(e.between,'series',S.ex)}else if(a==='rest-prescribed'||a==='quick'){r.agg=true;finish()}else if(a==='diff'){S.diff=!S.diff;S.dt='reps';S.dv=e.reps;workout()}else if(a==='pick'){S.dt=b.dataset.t;S.dv=S.dt==='sets'?e.sets:S.dt==='load'?e.load:e.reps;workout()}else if(a==='dv'){S.dv=Math.max(0,S.dv+(+b.dataset.d)*(S.dt==='load'?e.step:1));workout()}else if(a==='save'){r.d={type:S.dt,value:S.dv};S.diff=false;finish()}else if(a==='rt'){S.rest.seconds=Math.max(0,S.rest.seconds+(+b.dataset.d));S.rest.state=S.rest.seconds===0?'COMPLETE':S.rest.seconds<=5?'ENDING':'ACTIVE';workout()}else if(a==='early'||a==='done'){var k=S.rest.kind,n=S.rest.next;clearInterval(S.rt);S.rest=null;if(k==='series')workout();else transition(n)}else if(a==='manual'){var n2=S.rest.next;S.rest=null;transition(n2)}});setInterval(function(){if(S.screen==='workout'&&!S.rest){S.phase=(S.phase+1)%3;workout()}},1800);render();
})();
</script></body></html>
